<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진자 가속도 기록계</title>
<style>
:root{
  --paper:#E9EBE5; --panel:#F5F6F2; --line:#CFD5CD;
  --ink:#1E2320; --ink-2:#6A726B;
  --pen-a:#B23A2E; --pen-b:#1D6E6E; --warn:#8A5A00;
  --ax:#B23A2E; --ay:#2F7A4F; --az:#2F5FA0;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  padding:14px 14px calc(28px + env(safe-area-inset-bottom));
  max-width:620px;margin-inline:auto;
}
h1{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:10px}

/* 판독창 + 용수철 */
.head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px}
.nums{flex:1;min-width:0}
#spring{flex:none;width:84px;height:112px;border-left:1px solid var(--line);padding-left:0}
.read{display:flex;align-items:baseline;gap:7px;width:100%}
.read .v{font-family:var(--mono);font-size:clamp(38px,12vw,54px);font-weight:500;
  letter-spacing:-.035em;line-height:.85;font-variant-numeric:tabular-nums}
.read .u{font-family:var(--mono);font-size:16px;color:var(--ink-2)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.trio span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;margin-bottom:1px}
.trio b{font-family:var(--mono);font-size:clamp(16px,5vw,24px);font-weight:500;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;
  padding:10px 14px;border-top:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.seg button{padding:5px 10px;font-size:12px;font-weight:500;border:0;border-radius:0;
  background:transparent;color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
.seg button.on{background:var(--ink);color:#fff}
.s{font-size:12px;color:var(--ink-2);margin-left:auto}
.s.on{color:var(--pen-a);font-weight:500}

/* 기록지 */
.chan{padding:11px 14px 0}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:11.5px;color:var(--ink-2);margin-bottom:5px}
.lab b{font-weight:500}
.lab .now{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.lab em{font-style:normal;color:var(--ink-2);margin-right:7px}
canvas{display:block;background:transparent}
#chA,#chB{width:100%;border:1px solid var(--line);background:#FCFDFB}
.legend{font-size:11px;color:var(--ink-2);margin:0;padding:11px 14px 12px;line-height:1.55}
.key{display:inline-block;width:9px;height:2px;vertical-align:middle;margin:0 3px 2px 0}

/* 버튼 */
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.ctrl button{font-family:var(--sans);font-size:15px;font-weight:500;padding:15px 8px;
  border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.ctrl button.ghost{background:transparent;color:var(--ink)}
.ctrl button:disabled{opacity:.3;cursor:default}
.ctrl button.wide{grid-column:1/-1}
.ctrl button.rec{background:var(--pen-a);border-color:var(--pen-a)}
.opt{grid-column:1/-1;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2)}
.opt input{width:18px;height:18px;accent-color:var(--pen-a);flex:none}

/* 주기 */
.per{padding:14px}
.per .k{font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
.per .big{font-family:var(--mono);font-size:38px;font-weight:500;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.per .big small{font-size:15px;color:var(--ink-2);font-weight:400}
.per .sub{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-2)}
.per .sub span{font-family:var(--mono);color:var(--ink)}

/* 접히는 칸 */
details{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:10px}
summary{padding:11px 14px;font-size:13px;color:var(--ink-2);cursor:pointer;
  list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";font-size:11px}
details[open] summary{border-bottom:1px solid var(--line)}
details[open] summary::after{content:"▴"}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th,td{padding:5px 10px;text-align:right;font-variant-numeric:tabular-nums}
tbody tr:nth-child(odd){background:#EFF1EC}
th{font-size:10.5px;color:var(--ink-2);font-weight:500}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
.banner{background:var(--warn);color:#fff;padding:11px 13px;border-radius:4px;
  font-size:13.5px;margin-bottom:10px}
.tip{font-size:12px;color:var(--ink-2);margin:14px 2px 0;line-height:1.6}
</style>
</head>
<body>

<h1>진자 가속도 기록계</h1>
<div id="banner"></div>

<!-- 판독창 + 용수철저울 -->
<div class="card">
  <div class="head">
    <div class="nums">
      <div class="read" id="one">
        <span class="v" id="rMag">—</span><span class="u" id="rUnit">g</span>
      </div>
      <div class="trio" id="three" hidden>
        <div><span style="color:var(--ax)">AX</span><b id="rX">—</b></div>
        <div><span style="color:var(--ay)">AY</span><b id="rY">—</b></div>
        <div><span style="color:var(--az)">AZ</span><b id="rZ">—</b></div>
      </div>
    </div>
    <canvas id="spring"></canvas>
  </div>
  <div class="bar">
    <div class="seg" id="segU">
      <button data-v="g" class="on">g</button>
      <button data-v="ms2">m/s²</button>
    </div>
    <div class="seg" id="segV">
      <button data-v="mag" class="on">|a|</button>
      <button data-v="xyz">x y z</button>
    </div>
    <span class="s" id="rTag">센서 대기</span>
  </div>
</div>

<!-- 기록지 -->
<div class="card">
  <div class="chan">
    <div class="lab">
      <b style="color:var(--pen-a)" id="labA">가속도</b>
      <span class="now"><em id="ivA"></em><span id="cA">—</span></span>
    </div>
    <canvas id="chA"></canvas>
  </div>
  <div class="chan">
    <div class="lab">
      <b style="color:var(--pen-b)">각속도 ω · ±200 °/s</b>
      <span class="now"><em id="ivB"></em><span id="cB">—</span></span>
    </div>
    <canvas id="chB"></canvas>
  </div>
  <p class="legend" id="legend"></p>
</div>

<!-- 조작 -->
<div class="card">
  <div class="ctrl">
    <button class="wide" id="bStart">센서 켜기</button>
    <button id="bRec" disabled>기록 시작</button>
    <button class="ghost" id="bCsv" disabled>CSV 내려받기</button>
    <label class="opt"><input type="checkbox" id="oDelay" checked>5초 뒤 시작 (소리로 알림)</label>
  </div>
</div>

<!-- 주기 -->
<div class="card">
  <div class="per">
    <div class="k">측정된 주기 T</div>
    <div class="big" id="pMain">—</div>
    <div class="sub">
      <div>각속도에서 <span id="pB">—</span></div>
      <div>가속도에서 <span id="pA">—</span></div>
      <div><span id="sN">0</span>샘플 · <span id="sT">0.0</span>s</div>
    </div>
  </div>
</div>

<details><summary>최근 기록</summary>
  <table>
    <thead id="th"></thead>
    <tbody id="tb"><tr><td style="text-align:center;color:var(--ink-2);padding:14px">기록을 시작하면 표시됩니다</td></tr></tbody>
  </table>
</details>

<p class="tip">
  오른쪽 용수철은 폰에 매단 가상의 용수철저울입니다. |a|에 비례해 늘어나며,
  1주기에 두 번 튑니다.<br>
  화면 자동 회전을 잠그고, 폰을 케이스에 넣어 끈으로 단단히 매다세요. 진폭 30–40°에서 신호가 가장 뚜렷합니다.
</p>

<script>
/* ══ A. 오류 알림 ══════════════════════════════════════════
   오류는 맨 위 띠로 표시합니다.                              */
function banner(msg){
  const b = document.getElementById('banner');
  b.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'banner';
  d.textContent = msg;
  b.appendChild(d);
}
function log(msg, kind){
  try{ console.log(msg); }catch(e){}
  if (kind === 'e' || kind === 'w') banner(msg);
}
window.addEventListener('error', e => banner('오류: ' + e.message));
window.addEventListener('unhandledrejection', e => banner('오류: ' + e.reason));
if (!(location.protocol === 'https:' || location.hostname === 'localhost'))
  banner('HTTPS가 아니어서 센서를 쓸 수 없습니다. https 주소로 열어 주세요.');

/* ══ B. 단위와 보기 방식 ═══════════════════════════════════
   값은 항상 g 단위로 보관하고, 보여줄 때만 변환합니다.       */
const UNITS = {
  g:   {name:'g',    k:1,       dec:3, sfx:'_g',
        mag:{lo:0.4, hi:1.6, rows:6, mid:3, txt:'1.0 g'},
        xyz:{span:1.6, rows:8, mid:4, txt:'0'}},
  ms2: {name:'m/s²', k:9.80665, dec:2, sfx:'_ms2',
        mag:{lo:4, hi:16, rows:6, mid:3, txt:'10 m/s²'},
        xyz:{span:16, rows:8, mid:4, txt:'0'}}
};
let U = UNITS.g;
let VIEW = 'mag';
const toU = v => v * U.k;

document.getElementById('segU').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  U = UNITS[b.dataset.v];
  for (const x of document.querySelectorAll('#segU button')) x.classList.toggle('on', x === b);
  apply();
});
document.getElementById('segV').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  VIEW = b.dataset.v;
  for (const x of document.querySelectorAll('#segV button')) x.classList.toggle('on', x === b);
  apply();
});

function apply(){
  const isMag = VIEW === 'mag';
  document.getElementById('one').hidden   = !isMag;
  document.getElementById('three').hidden =  isMag;
  document.getElementById('rUnit').textContent = U.name;
  document.getElementById('labA').textContent = isMag
    ? `가속도 크기 |a| · ${U.mag.lo}–${U.mag.hi} ${U.name}`
    : `가속도 성분 · ±${U.xyz.span} ${U.name}`;
  document.getElementById('legend').innerHTML = isMag
    ? '● 극대점 · 가속도는 점 간격 <b>× 2 = 주기</b>, 각속도는 점 간격 <b>= 주기</b>'
    : '<span class="key" style="background:var(--ax)"></span>ax'
    + '<span class="key" style="background:var(--ay);margin-left:12px"></span>ay'
    + '<span class="key" style="background:var(--az);margin-left:12px"></span>az'
    + '<br>성분 보기에서는 극대점을 표시하지 않습니다. 주기 계산은 |a| 로 계속 진행됩니다.';
  document.getElementById('th').innerHTML = isMag
    ? `<tr><th>t (s)</th><th>|a| (${U.name})</th><th>ω (°/s)</th></tr>`
    : `<tr><th>t (s)</th><th>ax</th><th>ay</th><th>az</th><th>ω</th></tr>`;
}

/* ══ C. 값 보관소 ══════════════════════════════════════════ */
const G = 9.80665;
let sensorOn = false, recording = false, t0 = 0;
let rows = [], ring = [];
let live = {mag:1, x:0, y:0, z:0, w:0};

/* ══ D. 센서 켜기 ══════════════════════════════════════════ */
const bStart = document.getElementById('bStart');
const bRec   = document.getElementById('bRec');
const bCsv   = document.getElementById('bCsv');

bStart.addEventListener('click', async () => {
  bStart.disabled = true;
  try{
    if (typeof DeviceMotionEvent === 'undefined'){
      banner('이 브라우저에는 가속도 센서 기능이 없습니다.');
      bStart.disabled = false; return;
    }
    if (typeof DeviceMotionEvent.requestPermission === 'function'){
      const res = await DeviceMotionEvent.requestPermission();
      if (res !== 'granted'){
        banner('센서 권한이 거부되었습니다. 설정 > Safari > 동작 및 방향 접근을 켜 주세요.');
        bStart.disabled = false; return;
      }
    }
    window.addEventListener('devicemotion', onMotion);
    sensorOn = true;
    bStart.textContent = '센서 켜짐';
    bRec.disabled = false;
    setTag('센서 켜짐');
    keepAwake();
    setTimeout(() => { if (rawCount === 0)
      banner('센서 값이 들어오지 않습니다. 센서가 없는 기기일 수 있습니다.'); }, 2000);
  }catch(err){ banner('센서 켜기 실패: ' + err); bStart.disabled = false; }
});

function setTag(txt, on){
  const el = document.getElementById('rTag');
  el.textContent = txt;
  el.className = 's' + (on ? ' on' : '');
}

let wl = null;
async function keepAwake(){
  try{
    if ('wakeLock' in navigator){
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    }
  }catch(err){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && sensorOn && !wl) keepAwake();
});

/* ══ E. 센서 값 받기 ═══════════════════════════════════════ */
let rawCount = 0, warnedNull = false;
let axisPick = 'alpha', axisAcc = {alpha:0, beta:0, gamma:0}, axisAt = 0;

function onMotion(e){
  rawCount++;
  const a = e.accelerationIncludingGravity;
  if (!a || a.x === null){
    if (!warnedNull){ banner('가속도 값이 비어 있습니다.'); warnedNull = true; }
    return;
  }
  const now = performance.now();
  const x = a.x/G, y = a.y/G, z = a.z/G;
  const mag = Math.hypot(x, y, z);

  /* 진자는 한 축으로만 도니, 최근 3초간 가장 크게 흔들린 축만 사용 */
  let w = 0;
  const r = e.rotationRate;
  if (r && r.alpha !== null){
    axisAcc.alpha = Math.max(axisAcc.alpha, Math.abs(r.alpha));
    axisAcc.beta  = Math.max(axisAcc.beta,  Math.abs(r.beta));
    axisAcc.gamma = Math.max(axisAcc.gamma, Math.abs(r.gamma));
    if (now - axisAt > 3000){
      axisPick = Object.keys(axisAcc).reduce((p,c) => axisAcc[c] > axisAcc[p] ? c : p, 'alpha');
      axisAcc = {alpha:0, beta:0, gamma:0}; axisAt = now;
    }
    w = r[axisPick] || 0;
  }

  live = {mag, x, y, z, w};
  ring.push({t:now, mag, x, y, z, w});
  while (ring.length && now - ring[0].t > 10000) ring.shift();

  peakAccel(now, mag);
  peakGyro(now, w);

  if (recording){
    rows.push({t:(now-t0)/1000, mag, x, y, z, w,
               gx:r?r.alpha:null, gy:r?r.beta:null, gz:r?r.gamma:null});
    if (rows.length === 200000){ stopRec(); banner('샘플 20만 개에 도달해 자동 정지했습니다.'); }
  }
}

/* ══ F. 극대점 찾기와 주기 계산 ════════════════════════════
   |a| 의 극대점은 1주기에 두 번(최하점 통과) → 간격 × 2 = 주기
   ω  의 양의 극대점은 1주기에 한 번         → 간격     = 주기   */
const median = v => { const s = [...v].sort((a,b)=>a-b); return s[s.length>>1]; };
let pa = null, pb = null;

function showPeriod(){
  const main = (pb !== null) ? pb : pa;
  document.getElementById('pMain').innerHTML =
    (main === null) ? '—' : main.toFixed(3) + ' <small>s</small>';
  document.getElementById('pA').textContent = (pa === null) ? '—' : pa.toFixed(3) + ' s';
  document.getElementById('pB').textContent = (pb === null) ? '—' : pb.toFixed(3) + ' s';
}
function commit(s, minIv, maxIv){
  s.peaks.push({t:s.pt, v:s.pv});
  if (s.peaks.length > 60) s.peaks.shift();
  if (s.last !== null){
    const iv = (s.pt - s.last)/1000;
    if (iv > minIv && iv < maxIv){ s.iv.push(iv); if (s.iv.length > 7) s.iv.shift(); }
  }
  s.last = s.pt;
}

const A = {buf:[], above:false, pv:0, pt:0, last:null, iv:[], peaks:[]};
function peakAccel(now, mag){
  A.buf.push(mag); if (A.buf.length > 240) A.buf.shift();
  if (A.buf.length < 60) return;
  let mn = Infinity, mx = -Infinity, sum = 0;
  for (const v of A.buf){ if (v < mn) mn = v; if (v > mx) mx = v; sum += v; }
  const mean = sum/A.buf.length;
  const h = Math.max((mx-mn)*0.15, 0.01);
  if (mag > mean + h){
    if (!A.above){ A.above = true; A.pv = mag; A.pt = now; }
    else if (mag > A.pv){ A.pv = mag; A.pt = now; }
  } else if (A.above){
    A.above = false;
    commit(A, 0.08, 10);
    if (A.iv.length >= 3){ pa = median(A.iv)*2; showPeriod(); }
  }
}

const B = {amp:0, above:false, pv:0, pt:0, last:null, iv:[], peaks:[]};
function peakGyro(now, w){
  B.amp = Math.max(B.amp*0.999, Math.abs(w));
  const h = Math.max(B.amp*0.25, 4);
  if (w > h){
    if (!B.above){ B.above = true; B.pv = w; B.pt = now; }
    else if (w > B.pv){ B.pv = w; B.pt = now; }
  } else if (B.above){
    B.above = false;
    commit(B, 0.15, 20);
    if (B.iv.length >= 3){ pb = median(B.iv); showPeriod(); }
  }
}
function resetPeaks(){
  for (const s of [A, B]){ s.above = false; s.last = null; s.iv = []; s.peaks = []; }
  A.buf = []; B.amp = 0;
  pa = pb = null; showPeriod();
}

/* ══ G. 기록 시작 / 정지 ═══════════════════════════════════ */
let delayTimer = null;
bRec.addEventListener('click', () => {
  if (recording || delayTimer){ stopRec(); return; }
  if (document.getElementById('oDelay').checked){
    let n = 5;
    bRec.textContent = '시작까지 ' + n;
    bRec.classList.add('rec');
    beep(660, .08);
    delayTimer = setInterval(() => {
      n--;
      if (n > 0){ bRec.textContent = '시작까지 ' + n; beep(660, .08); }
      else { clearInterval(delayTimer); delayTimer = null; beep(990, .25); startRec(); }
    }, 1000);
  } else startRec();
});

function startRec(){
  rows = []; recording = true; t0 = performance.now();
  resetPeaks();
  bRec.textContent = '기록 정지'; bRec.classList.add('rec');
  bCsv.disabled = true;
  setTag('기록 중', true);
}
function stopRec(){
  if (delayTimer){ clearInterval(delayTimer); delayTimer = null; }
  recording = false;
  bRec.textContent = '기록 시작'; bRec.classList.remove('rec');
  bCsv.disabled = rows.length === 0;
  setTag(sensorOn ? '센서 켜짐' : '센서 대기');
}

/* 진동은 가속도계를 오염시키므로 소리로 알립니다 */
let ac = null;
function beep(freq, dur){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.25, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
    o.start(); o.stop(ac.currentTime + dur);
  }catch(err){}
}

/* ══ H. CSV — 보기 방식과 무관하게 항상 전부 저장합니다 ════ */
bCsv.addEventListener('click', () => {
  try{
    const k = U.k, e = U.sfx;
    let s = `t_s,a_mag${e},ax${e},ay${e},az${e},w_used_dps,w_alpha,w_beta,w_gamma\n`;
    for (const r of rows)
      s += [r.t.toFixed(4), (r.mag*k).toFixed(5), (r.x*k).toFixed(5),
            (r.y*k).toFixed(5), (r.z*k).toFixed(5), r.w.toFixed(3),
            r.gx === null ? '' : r.gx.toFixed(3),
            r.gy === null ? '' : r.gy.toFixed(3),
            r.gz === null ? '' : r.gz.toFixed(3)].join(',') + '\n';
    const url = URL.createObjectURL(new Blob([s], {type:'text/csv'}));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pendulum_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(err){ banner('CSV 저장 실패: ' + err); }
});

/* ══ I. 화면 그리기 ════════════════════════════════════════
   ※ 캔버스 높이는 상수로 고정하고 절대 되읽지 않습니다.       */
const H_A = 148, H_B = 100, H_S = 112;
const chA = document.getElementById('chA'), ctxA = chA.getContext('2d');
const chB = document.getElementById('chB'), ctxB = chB.getContext('2d');
const spr = document.getElementById('spring'), ctxS = spr.getContext('2d');
const PEN_A = '#B23A2E', PEN_B = '#1D6E6E';
const CX = '#B23A2E', CY = '#2F7A4F', CZ = '#2F5FA0';

function fit(c, cssH){
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(c.clientWidth, 1);
  c.width  = Math.round(w * d);
  c.height = Math.round(cssH * d);
  c.style.height = cssH + 'px';
  c.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
  return {w:w, h:cssH};
}
let dimA = fit(chA, H_A), dimB = fit(chB, H_B), dimS = fit(spr, H_S);
let lastW = chA.clientWidth, rt = null;
function refit(){
  const w = chA.clientWidth;
  if (w === lastW || w < 1) return;      // 가로폭이 실제로 변했을 때만
  lastW = w;
  dimA = fit(chA, H_A);
  dimB = fit(chB, H_B);
  dimS = fit(spr, H_S);
}
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(refit, 150); });
window.addEventListener('orientationchange', () => setTimeout(refit, 300));
window.addEventListener('load', refit);

const W_MAX = 200;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const mapMag = (v, d) => {
  const c = U.mag;
  return d.h - clamp((toU(v) - c.lo)/(c.hi - c.lo), 0, 1)*d.h;
};
const mapSym = (v, d) => d.h/2 - clamp(toU(v)/U.xyz.span, -1, 1)*d.h/2;
const mapW   = (v, d) => d.h/2 - clamp(v/W_MAX, -1, 1)*d.h/2;

function grid(ctx, d, rowsN, mid, midText){
  ctx.clearRect(0, 0, d.w, d.h);
  ctx.lineWidth = 1; ctx.setLineDash([]);
  for (let i = 1; i < 10; i++){
    ctx.strokeStyle = '#DDE2DA';
    const x = Math.round(d.w*i/10) + .5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, d.h); ctx.stroke();
  }
  for (let i = 1; i < rowsN; i++){
    const y = Math.round(d.h*i/rowsN) + .5;
    ctx.strokeStyle = (i === mid) ? '#AEB6AC' : '#DDE2DA';
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(d.w, y); ctx.stroke();
  }
  if (midText){
    ctx.fillStyle = '#8E968C';
    ctx.font = '10px ui-monospace, monospace';
    ctx.fillText(midText, 4, Math.round(d.h*mid/rowsN) - 4);
  }
}
function trace(ctx, d, color, pick, map, head){
  if (ring.length < 2) return;
  const now = ring[ring.length-1].t;
  ctx.strokeStyle = color; ctx.lineWidth = 1.6;
  ctx.lineJoin = 'round'; ctx.setLineDash([]);
  ctx.beginPath();
  let started = false;
  for (const p of ring){
    const x = d.w - (now - p.t)/10000*d.w;
    const y = map(pick(p), d);
    if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
  }
  ctx.stroke();
  if (head){
    const y = map(pick(ring[ring.length-1]), d);
    ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(d.w, y); ctx.lineTo(d.w-7, y-4.5); ctx.lineTo(d.w-7, y+4.5);
    ctx.closePath(); ctx.fill();
  }
}
function marks(ctx, d, st, color, map, out){
  const el = document.getElementById(out);
  if (!ring.length){ el.textContent = ''; return; }
  const now = ring[ring.length-1].t;
  const vis = [];
  for (const p of st.peaks) if (now - p.t <= 10000) vis.push(p);
  for (const p of vis){
    const x = d.w - (now - p.t)/10000*d.w;
    const y = map(p.v, d);
    ctx.strokeStyle = color; ctx.globalAlpha = .4; ctx.lineWidth = 1;
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(x, y+4); ctx.lineTo(x, d.h); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 6.2832);
    ctx.fillStyle = '#FCFDFB'; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.stroke();
  }
  el.textContent = vis.length >= 2
    ? '점 간격 ' + ((vis[vis.length-1].t - vis[vis.length-2].t)/1000).toFixed(3) + 's ·'
    : '';
}

/* ── 가상 용수철저울 ────────────────────────────────────────
   용수철저울에 매달린 추는 그 기기가 받는 알짜 힘(= |a|)에
   비례해 늘어납니다. 그래서 늘어난 길이가 곧 |a| 입니다.
   정지 상태(1 g)를 기준선으로 두고 위아래로 움직입니다.      */
function drawSpring(){
  const d = dimS, ctx = ctxS;
  ctx.clearRect(0, 0, d.w, d.h);
  const cx = d.w/2, yTop = 10, restY = 68;
  const yM = restY + clamp((live.mag - 1) * 46, -26, 30);

  /* 천장과 빗금 */
  ctx.strokeStyle = '#AEB6AC'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx-22, yTop); ctx.lineTo(cx+22, yTop); ctx.stroke();
  ctx.lineWidth = 1;
  for (let i = -21; i < 22; i += 7){
    ctx.beginPath(); ctx.moveTo(cx+i, yTop); ctx.lineTo(cx+i-5, yTop-5); ctx.stroke();
  }

  /* 1 g 기준선 */
  ctx.setLineDash([2,3]); ctx.strokeStyle = '#C6CCC4';
  ctx.beginPath(); ctx.moveTo(2, restY+12); ctx.lineTo(d.w-2, restY+12); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#9AA298'; ctx.font = '9px ui-monospace, monospace';
  ctx.fillText('1 g', 2, restY+24);

  /* 코일 */
  const yA = yTop + 3, yB = yM - 12, N = 96, coils = 7, amp = 11;
  ctx.strokeStyle = PEN_A; ctx.lineWidth = 1.7; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx, yTop); ctx.lineTo(cx, yA);
  for (let i = 1; i <= N; i++){
    const f = i/N;
    ctx.lineTo(cx + Math.sin(f*coils*2*Math.PI)*amp, yA + f*(yB - yA));
  }
  ctx.lineTo(cx, yM - 12);
  ctx.stroke();

  /* 추 */
  ctx.fillStyle = PEN_A;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx-12, yM-12, 24, 24, 4);
  else ctx.rect(cx-12, yM-12, 24, 24);
  ctx.fill();
}

function frame(){
  if (sensorOn){
    const f = v => toU(v).toFixed(U.dec);
    document.getElementById('rMag').textContent = f(live.mag);
    document.getElementById('rX').textContent = f(live.x);
    document.getElementById('rY').textContent = f(live.y);
    document.getElementById('rZ').textContent = f(live.z);
    document.getElementById('cA').textContent = VIEW === 'mag'
      ? f(live.mag) + ' ' + U.name
      : `${f(live.x)} / ${f(live.y)} / ${f(live.z)}`;
    document.getElementById('cB').textContent = live.w.toFixed(0) + ' °/s';
  }

  if (VIEW === 'mag'){
    grid(ctxA, dimA, U.mag.rows, U.mag.mid, U.mag.txt);
    trace(ctxA, dimA, PEN_A, p => p.mag, mapMag, true);
    marks(ctxA, dimA, A, PEN_A, mapMag, 'ivA');
  } else {
    grid(ctxA, dimA, U.xyz.rows, U.xyz.mid, U.xyz.txt);
    trace(ctxA, dimA, CX, p => p.x, mapSym, false);
    trace(ctxA, dimA, CY, p => p.y, mapSym, false);
    trace(ctxA, dimA, CZ, p => p.z, mapSym, false);
    document.getElementById('ivA').textContent = '';
  }

  grid(ctxB, dimB, 4, 2, '0');
  trace(ctxB, dimB, PEN_B, p => p.w, mapW, true);
  marks(ctxB, dimB, B, PEN_B, mapW, 'ivB');

  drawSpring();

  if (recording){
    document.getElementById('sN').textContent = rows.length;
    document.getElementById('sT').textContent = ((performance.now()-t0)/1000).toFixed(1);
  }
  requestAnimationFrame(frame);
}
apply();
requestAnimationFrame(frame);

/* 표는 초당 5번만 갱신 (60번 갱신하면 화면이 버벅입니다) */
setInterval(() => {
  if (!recording || rows.length === 0) return;
  const f = v => toU(v).toFixed(U.dec);
  document.getElementById('tb').innerHTML = rows.slice(-10).reverse().map(r =>
    VIEW === 'mag'
      ? `<tr><td>${r.t.toFixed(2)}</td><td>${f(r.mag)}</td><td>${r.w.toFixed(1)}</td></tr>`
      : `<tr><td>${r.t.toFixed(2)}</td><td>${f(r.x)}</td><td>${f(r.y)}</td><td>${f(r.z)}</td><td>${r.w.toFixed(1)}</td></tr>`
  ).join('');
}, 200);
</script>
