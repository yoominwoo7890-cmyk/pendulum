<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연결 시험</title>
<style>
:root{
  --paper:#E9EBE5; --panel:#F5F6F2; --line:#CFD5CD;
  --ink:#1E2320; --ink-2:#6A726B;
  --ok:#1D6E6E; --bad:#B23A2E; --warn:#8A5A00;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;padding:16px 14px 40px;max-width:560px;margin-inline:auto}
h1{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:14px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px}
input{width:100%;font-family:var(--mono);font-size:22px;padding:11px 12px;
  border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);
  text-align:center;letter-spacing:.1em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button{font-family:var(--sans);font-size:15px;font-weight:500;padding:16px 8px;
  border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;
  background:var(--bad);margin-right:7px;vertical-align:middle}
.dot.ok{background:var(--ok)}
.big{font-family:var(--mono);font-size:44px;font-weight:500;line-height:1.1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.k{font-size:11.5px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.grid b{display:block;font-family:var(--mono);font-size:19px;font-weight:500;
  font-variant-numeric:tabular-nums}
.msg{padding:11px 13px;border-radius:4px;font-size:13.5px;margin-bottom:10px}
.msg.bad{background:var(--bad);color:#fff}
.msg.good{background:var(--ok);color:#fff}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:14px}
</style>
</head>
<body>

<h1>연결 시험 · 본 앱과 별개입니다</h1>
<div id="msg"></div>

<!-- 시작 화면 -->
<div class="card" id="setup">
  <label for="code">방 코드 (양쪽이 같아야 합니다)</label>
  <input id="code" value="1" inputmode="numeric" autocomplete="off">
  <div class="row">
    <button id="bSend">송신부</button>
    <button class="ghost" id="bRecv">수신부</button>
  </div>
</div>

<!-- 동작 화면 -->
<div class="card" id="live" hidden>
  <div class="k"><span class="dot" id="dot"></span><span id="state">연결 중…</span></div>
  <div class="big" id="num">—</div>
  <div class="grid">
    <div><span class="k" id="k1">보낸 횟수</span><b id="v1">0</b></div>
    <div><span class="k" id="k2">초당</span><b id="v2">—</b></div>
  </div>
</div>

<p class="hint" id="hint"></p>

<script>
/* 8초 안에 Firebase가 안 뜨면 알려줍니다 */
let booted = false;
setTimeout(() => { if (!booted) msg('Firebase 파일을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.', 'bad'); }, 8000);

function msg(text, kind){
  const b = document.getElementById('msg');
  b.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'msg ' + (kind || 'bad');
  d.textContent = text;
  b.appendChild(d);
}
window.addEventListener('error', e => msg('오류: ' + e.message));
window.addEventListener('unhandledrejection', e => msg('오류: ' + e.reason));
</script>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const CFG = {
  apiKey: "AIzaSyAwn5pRptBTs_-Krawmkygh3ot03T4AJqU",
  authDomain: "pendulum-69d5a.firebaseapp.com",
  databaseURL: "https://pendulum-69d5a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pendulum-69d5a",
  storageBucket: "pendulum-69d5a.firebasestorage.app",
  messagingSenderId: "896770448041",
  appId: "1:896770448041:web:1a027670c6dec5a9bb67b8"
};

const $ = id => document.getElementById(id);
let db, offset = 0;

try{
  db = getDatabase(initializeApp(CFG));
  window.booted = true;
  /* 서버 시계와의 차이 — 지연 시간을 대략 재는 데 씁니다 */
  onValue(ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });
  /* Firebase 서버와 붙어 있는지 */
  onValue(ref(db, '.info/connected'), s => {
    const on = s.val() === true;
    $('dot').className = 'dot' + (on ? ' ok' : '');
    $('state').textContent = on ? 'Firebase 연결됨' : '연결 끊김 — 다시 시도 중';
  });
}catch(err){ msg('Firebase 시작 실패: ' + err); }

const now = () => Date.now() + offset;

$('bSend').addEventListener('click', () => start('send'));
$('bRecv').addEventListener('click', () => start('recv'));

function start(role){
  const code = ($('code').value || '1').trim();
  $('setup').hidden = true;
  $('live').hidden = false;
  const path = 'test/' + code;

  if (role === 'send'){
    document.title = '송신부';
    $('k1').textContent = '보낸 횟수';
    $('k2').textContent = '초당';
    $('hint').textContent =
      '이 화면은 0.3초마다 숫자를 하나씩 올려 보냅니다. 다른 기기에서 같은 코드로 수신부를 열어 보세요.';
    let n = 0, sent = 0;
    setInterval(() => {
      n++;
      set(ref(db, path), {n:n, t:now()})
        .then(() => { sent++; })
        .catch(err => msg('쓰기 거부됨: ' + err.message));
      $('num').textContent = n;
      $('v1').textContent = sent;
    }, 300);
    setInterval(() => { $('v2').textContent = sent; sent = 0; }, 1000);

  } else {
    document.title = '수신부';
    $('k1').textContent = '초당 수신';
    $('k2').textContent = '지연 (대략)';
    $('hint').textContent =
      '숫자가 계속 올라가면 성공입니다. 멈춰 있으면 송신부가 꺼졌거나 방 코드가 다릅니다.';
    let got = 0, lag = 0, seen = false;
    onValue(ref(db, path), s => {
      const v = s.val();
      if (!v) return;
      seen = true; got++;
      lag = Math.max(0, now() - v.t);
      $('num').textContent = v.n;
      $('v2').textContent = lag + ' ms';
    }, err => msg('읽기 거부됨: ' + err.message));
    setInterval(() => { $('v1').textContent = got; got = 0; }, 1000);
    setTimeout(() => { if (!seen) msg('아직 아무것도 안 들어옵니다. 송신부가 켜져 있는지, 방 코드가 같은지 확인하세요.', 'bad'); }, 6000);
  }
}
</script>
</body>
</html>
